services:
  - type: web
    name: qimen-shisan-gong-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_ACCESS_KEY_HASH
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        value: https://142857110823.github.io,http://localhost:8090
      - key: AI_BASE_URL
        value: https://www.juapi.net/v1
      - key: AI_API_KEY
        sync: false
    disk:
      name: qimen-data
      mountPath: /var/data
      sizeGB: 1
